<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test case - Tool AI Testing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"></header>
<main>
  <h1 id="title">Test case</h1>
  <div id="status" class="status" role="status"></div>
  <div id="next-step"></div>
  <div id="stale" class="banner" hidden>
    File test case vừa được sửa ở nơi khác trong lúc bạn đang sửa một dòng.
    <button id="reload" type="button" class="small">Tải lại (bỏ phần đang sửa)</button>
  </div>
  <div class="row">
    <label class="inline" for="filter">Lọc theo trạng thái</label>
    <select id="filter"></select>
    <span id="count" class="muted"></span>
  </div>
  <table id="list">
    <thead>
      <tr><th>ID</th><th>Tiêu đề</th><th>Màn</th><th>Ưu tiên</th><th>Loại</th><th>Trạng thái</th><th></th></tr>
    </thead>
    <tbody></tbody>
  </table>
</main>
<script src="app.js"></script>
<script src="next-step.js"></script>
<script>
  const { h, api, status, action, watch, header, param, $, STATUS_LABEL } = App;
  const f = param("f");
  const base = `/api/features/${encodeURIComponent(f)}`;
  const st = status();
  header(`Tính năng / ${f} / Test case`);
  $("#title").textContent = `Test case: ${f}`;

  const PRIORITIES = ["High", "Medium", "Low"];
  const TYPES = ["positive", "negative", "boundary", "validation"];
  let cases = [];
  let openIds = new Set(); // dòng đang mở để sửa
  let dirty = false;

  const filter = $("#filter");
  filter.append(h("option", { value: "" }, "Tất cả"));
  for (const [v, label] of Object.entries(STATUS_LABEL)) filter.append(h("option", { value: v }, label));
  filter.addEventListener("change", render);

  const lines = (text) => text.split("\n").map((x) => x.trim()).filter(Boolean);

  function select(options, value) {
    const el = h("select", {}, options.map((o) => h("option", { value: o }, o)));
    el.value = value;
    return el;
  }

  function editor(tc, summaryRow) {
    const title = h("input", { type: "text", value: tc.title });
    const priority = select(PRIORITIES, tc.priority);
    const type = select(TYPES, tc.type);
    const pre = h("textarea", {}, tc.preconditions.join("\n"));
    const steps = h("textarea", { rows: 6 }, tc.steps.join("\n"));
    const expected = h("textarea", { rows: 4 }, tc.expected.join("\n"));
    const note = h("textarea", { rows: 2 }, tc.tester_note || "");
    const save = h("button", { class: "primary", type: "button" }, "Lưu thay đổi");
    const cancel = h("button", { type: "button" }, "Đóng");
    for (const el of [title, priority, type, pre, steps, expected, note]) el.addEventListener("input", () => (dirty = true));
    save.addEventListener("click", async () => {
      const patch = {
        title: title.value.trim(),
        priority: priority.value,
        type: type.value,
        preconditions: lines(pre.value),
        steps: lines(steps.value),
        expected: lines(expected.value),
        tester_note: note.value.trim() || undefined,
      };
      const ok = await action(save, st, `Đã lưu ${tc.id}`, () => api("PATCH", `${base}/testcases/${encodeURIComponent(tc.id)}`, patch));
      if (ok) {
        dirty = false;
        openIds.delete(tc.id);
        await load();
      }
    });
    cancel.addEventListener("click", () => {
      openIds.delete(tc.id);
      dirty = false;
      render();
    });
    return h(
      "tr",
      { class: "detail" },
      h(
        "td",
        { colSpan: 7 },
        h("label", {}, "Tiêu đề"), title,
        h("div", { class: "row" }, h("label", { class: "inline" }, "Ưu tiên"), priority, h("label", { class: "inline" }, "Loại"), type),
        h("label", {}, "Điều kiện trước (mỗi dòng một mục)"), pre,
        h("label", {}, "Các bước (mỗi dòng một bước)"), steps,
        h("label", {}, "Kết quả mong đợi (mỗi dòng một mục)"), expected,
        h("label", {}, "Ghi chú của tester"), note,
        h("div", { class: "row" }, save, cancel),
      ),
    );
  }

  async function setStatus(tc, next, button) {
    const ok = await action(button, st, `${tc.id}: ${tc.status} -> ${next}`, () => api("PATCH", `${base}/testcases/${encodeURIComponent(tc.id)}`, { status: next }));
    if (ok) await load();
  }

  function render() {
    const wanted = filter.value;
    const shown = cases.filter((t) => !wanted || t.status === wanted);
    $("#count").textContent = `${shown.length}/${cases.length} test case`;
    const rows = [];
    for (const tc of shown) {
      const open = openIds.has(tc.id);
      const toggle = h("button", { class: "small", type: "button" }, open ? "Đóng" : "Xem / sửa");
      toggle.addEventListener("click", () => {
        if (open) openIds.delete(tc.id);
        else openIds.add(tc.id);
        render();
      });
      let action1 = null;
      if (tc.status === "draft" || tc.status === "reviewed") {
        const next = tc.status === "draft" ? "reviewed" : "draft";
        action1 = h("button", { class: tc.status === "draft" ? "small primary" : "small", type: "button" }, tc.status === "draft" ? "Duyệt (draft → reviewed)" : "Trả về draft");
        action1.addEventListener("click", () => setStatus(tc, next, action1));
      }
      rows.push(
        h(
          "tr",
          {},
          h("td", {}, tc.id),
          h("td", {}, tc.title, tc.manual && h("span", { class: "badge" }, "thủ công")),
          h("td", {}, tc.screen || ""),
          h("td", {}, tc.priority),
          h("td", {}, tc.type),
          h("td", {}, STATUS_LABEL[tc.status] || tc.status),
          h("td", {}, h("div", { class: "row" }, toggle, action1)),
        ),
      );
      if (open) rows.push(editor(tc));
    }
    if (!rows.length) rows.push(h("tr", {}, h("td", { colSpan: 7, class: "muted" }, cases.length ? "Không có test case ở trạng thái này." : "Chưa có test case.")));
    $("#list tbody").replaceChildren(...rows);
  }

  async function load() {
    try {
      const [overview, data] = await Promise.all([api("GET", `${base}/overview`), api("GET", `${base}/testcases`)]);
      NextStep.mount($("#next-step"), overview);
      cases = data.testcases;
      $("#stale").hidden = true;
      render();
    } catch (err) {
      st.fail(err);
    }
  }

  $("#reload").addEventListener("click", () => {
    dirty = false;
    openIds = new Set();
    load();
  });

  // Đang sửa dở thì không vẽ lại, chỉ báo để không mất chữ đã gõ.
  watch(
    (p) => p.startsWith(`features/${f}/`) || p.startsWith("evidence/"),
    () => (dirty ? ($("#stale").hidden = false) : load()),
  );
  load();
</script>
</body>
</html>
